[tool.poetry]
name = "energy-cost-calculator"
version = "0.1.0"
description = "Energy cost calculator for utility rate structures"
authors = ["PNNL"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
pandas = "^2.0.0"
numpy = "^1.24.0"
requests = "^2.31.0"

[tool.poetry.group.dev.dependencies]
black = "^24.0.0"
pytest = "^9.0.3"
ipython = "<9"
tqdm = "^4.67.3"

[tool.black]
line-length = 88
target-version = ['py310', 'py311']
extend-exclude = '''
/(
  tests/references/tou_calculator\.py
)/
'''

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
